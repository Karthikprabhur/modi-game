<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Vikas Runner</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
      font-family: system-ui, -apple-system, sans-serif;
    }
    #gameContainer {
      position: relative;
      width: 100vw;
      height: 100vh;
      max-width: 100%;
      max-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas {
      background: #7ec8e3;
      width: 100vw;
      height: 100vh;
      object-fit: contain; /* Keeps aspect ratio clean across any phone screen */
      display: block;
    }
    #startOverlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.78);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 10;
    }
    #startOverlay h2 {
      color: #FFD700;
      font-size: clamp(24px, 5vw, 36px);
      margin-bottom: 8px;
      text-align: center;
    }
    #startOverlay p {
      color: #fff;
      font-size: clamp(14px, 3.5vw, 18px);
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="gameContainer">
    <canvas id="gameCanvas" width="800" height="360"></canvas>
    <div id="startOverlay">
      <h2>TAP TO PLAY FULLSCREEN</h2>
      <p>Audio & Controls Enabled</p>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
